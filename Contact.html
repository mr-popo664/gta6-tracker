<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Mohit Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 dark:bg-[#0A0D14] text-slate-900 dark:text-slate-100 font-sans antialiased p-6 sm:p-10">
    
    <div class="max-w-xl mx-auto space-y-6">
      <!-- Back Button -->
      <a href="index.html" class="inline-flex items-center text-sm font-semibold text-pink-600 dark:text-pink-500 hover:underline mb-4">
        &larr; Back to Tracker
      </a>

      <!-- Page Title -->
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Contact Us</h1>
      <p class="text-slate-700 dark:text-slate-300">Have a question, feature request, or found a bug in the tracker? Send a message below.</p>
      
      <!-- Contact Form -->
      <form action="https://formspree.io/f/YOUR_ENDPOINT_HERE" method="POST" class="space-y-4 pt-4">
        <div>
          <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Name</label>
          <input type="text" id="name" name="name" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>
        
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input type="email" id="email" name="email" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>
        
        <div>
          <label for="message" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Message</label>
          <textarea id="message" name="message" rows="5" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500"></textarea>
        </div>
        
        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-2.5 px-4 rounded-lg transition-colors shadow-lg">
          Send Message
        </button>
      </form>
    </div>

  </body>
</html>
